<!doctype html>
<!-- lang/dir are updated at runtime by src/i18n so Arabic (RTL) can be added later -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9efeb" />
    <meta name="description" content="Find LAU facilities and resources on a map." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Campus Compass</title>
    <script>
      // Apply the saved (or the device's) light/dark theme before anything draws.
      try {
        var t = localStorage.getItem('campus-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
